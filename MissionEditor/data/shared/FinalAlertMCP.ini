; FinalAlert 2 MCP server configuration.
; This file is read from the same directory as the editor executable.

[Server]
; Set to 0 to disable the MCP server completely.
Enabled=1

; Keep the listener on loopback. For ChatGPT use Secure MCP Tunnel instead of
; exposing this port on the LAN or the public Internet.
BindAddress=127.0.0.1
Port=7462
Endpoint=/mcp

; Optional bearer token. Empty means that HTTP bearer authentication is off.
; If enabled, clients must send: Authorization: Bearer <the same value>
; Use a long random secret and never commit or publish the configured copy.
AuthToken=

; Comma-separated allowlists used to mitigate DNS rebinding and hostile pages.
AllowedHosts=localhost,127.0.0.1,[::1]
AllowedOrigins=https://chatgpt.com,https://chat.openai.com

; Maximum JSON request size in bytes (16 MiB by default).
MaxRequestBytes=16777216
