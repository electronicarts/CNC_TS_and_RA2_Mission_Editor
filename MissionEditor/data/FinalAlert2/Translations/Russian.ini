Please specify if you want to save your multiplayer map as *.mmx map or as *.mpr map. While *.mmx maps are the recommended method, as they are fully supported and do not slow down RA2 when loading, they are never transferred automatically to other players!=Выберите формат сетевой карты: *.mmx или *.mpr. Формат *.mmx рекомендуется: он полностью поддерживается и не замедляет загрузку RA2. Однако такие карты не передаются другим игрокам автоматически!
