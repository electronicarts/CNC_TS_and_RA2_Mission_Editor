MV_TubeCounterpartMissing=У туннеля %5 (%1, %2) -> (%3, %4) нет обратного туннеля из (%3, %4) -> (%1, %2).\nЭто приведёт к непредсказуемым ошибкам и сбоям игры.\nОбратный туннель может идти другим путём, но его начальная и конечная клетки должны быть переставлены местами.
MV_TubeStartNotUnique=Начальные координаты туннеля %5 (%1, %2) -> (%3, %4) совпадают с началом других туннелей: %6.\nЭто приведёт к непредсказуемым ошибкам и сбоям игры.\nИз каждой клетки может начинаться только один туннель.
MV_TubeEndNotUnique=Конечные координаты туннеля %5 (%1, %2) -> (%3, %4) совпадают с концом других туннелей: %6.\nЭто приведёт к непредсказуемым ошибкам и сбоям игры.\nВ каждой клетке может заканчиваться только один туннель.
MV_TubeInvalidCounterpartEnd=Для туннеля %5 (%1, %2) -> (%3, %4) найдены другие туннели (%6), заканчивающиеся в его начальной клетке, но его конечная клетка не совпадает с их начальной клеткой.\nЭто приведёт к непредсказуемым ошибкам и сбоям игры.\nУ обратного туннеля начальные и конечные координаты должны быть переставлены местами.
MV_TubeInvalidCounterpartStart=Для туннеля %5 (%1, %2) -> (%3, %4) найдены другие туннели (%6), начинающиеся в его конечной клетке, но его начальная клетка не совпадает с их конечной клеткой.\nЭто приведёт к непредсказуемым ошибкам и сбоям игры.\nУ обратного туннеля начальные и конечные координаты должны быть переставлены местами.
