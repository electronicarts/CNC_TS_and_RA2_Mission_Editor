Please wait a few seconds while FinalAlert 2 is saving. On very large maps this may even take some minutes, please do not cancel! More information is available in the status bar, most time will be needed for packing.=Подождите, пока FinalAlert 2 сохранит карту. Для очень больших карт это может занять несколько минут. Не отменяйте сохранение! Подробности отображаются в строке состояния, больше всего времени занимает упаковка данных.
Please wait a few seconds while FinalSun is saving. On very large maps this may even take some minutes, please do not cancel! More information is available in the status bar, most time will be needed for packing.=Подождите, пока FinalSun сохранит карту. Для очень больших карт это может занять несколько минут. Не отменяйте сохранение! Подробности отображаются в строке состояния, больше всего времени занимает упаковка данных.
