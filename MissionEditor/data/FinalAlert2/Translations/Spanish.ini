MV_TubeCounterpartMissing=El tramo de túnel %5 (%1, %2) -> (%3, %4) no tiene un tramo de retorno de (%3, %4) -> (%1, %2).\nEsto provocará errores imprevisibles y cierres del juego.\nEl tramo de retorno no necesita seguir el mismo recorrido, pero debe invertir las celdas de inicio y fin.
MV_TubeStartNotUnique=El tramo de túnel %5 (%1, %2) -> (%3, %4) comparte sus coordenadas iniciales con otros %6 tramos de túnel.\nEsto provocará errores imprevisibles y cierres del juego.\nSolo puede comenzar un tramo en cada celda.
MV_TubeEndNotUnique=El tramo de túnel %5 (%1, %2) -> (%3, %4) comparte sus coordenadas finales con otros %6 tramos de túnel.\nEsto provocará errores imprevisibles y cierres del juego.\nSolo puede comenzar un tramo en cada celda.
MV_TubeInvalidCounterpartEnd=El tramo de túnel %5 (%1, %2) -> (%3, %4) tiene otros %6 tramos de túnel que terminan en su celda inicial, pero su celda final no coincide con el inicio de esos tramos.\nEsto provocará errores imprevisibles y cierres del juego.\nUn tramo de retorno debe invertir tanto las coordenadas iniciales como las finales.
MV_TubeInvalidCounterpartStart=El tramo de túnel %5 (%1, %2) -> (%3, %4) tiene otros %6 tramos de túnel que comienzan en su celda final, pero su celda inicial no coincide con el final de esos tramos.\nEsto provocará errores imprevisibles y cierres del juego.\nUn tramo de retorno debe invertir tanto las coordenadas iniciales como las finales.
