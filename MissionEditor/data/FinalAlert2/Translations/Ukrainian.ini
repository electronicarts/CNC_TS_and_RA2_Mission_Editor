Please select here if you want to create a completely new map from scratch or if you want to import an already existing map (Note: You cannot import maps created by the random map generator of RA2)=Виберіть створення нової карти з нуля або імпорт наявної карти. Примітка: імпорт карт, створених генератором випадкових карт RA2, не підтримується.
Please select if you want to create a new singleplayer map or multiplayer map. Multiplayer maps are maps used in both skirmish and multiplayer games.=Виберіть тип нової карти: для одного гравця або мережева. Мережеві карти використовуються як у сутичках, так і в мережевій грі.
Please select size, theater and starting height here. The size should be below 100x100 for best results.=Виберіть розмір, тип місцевості та початкову висоту. Для найкращих результатів розмір має бути меншим за 100x100.
Please select size, theater and starting height here. The size should be below 150x150.=Виберіть розмір, тип місцевості та початкову висоту. Розмір має бути меншим за 150x150.
Please select the human player. It is recommended to leave the other options as they are.=Виберіть сторону гравця. Решту параметрів рекомендовано залишити без змін.
Please select the map you want to import. No triggers or houses will be imported. Bitmaps will be scaled down to appropiate size. Currently bitmaps will always be converted to temperate theater maps.=Виберіть карту для імпорту. Тригери та сторони не імпортуються. Растрові зображення буде зменшено до відповідного розміру. Наразі вони завжди перетворюються на карти з помірним типом місцевості.
Please select the trees that shall be placed=Виберіть дерева для розміщення
Please specify if you want to save your multiplayer map as *.mmx map or as *.mpr map. While *.mmx maps are the recommended method, as they are fully supported and do not slow down RA2 when loading, they are never transferred automatically to other players!=Виберіть формат мережевої карти: *.mmx або *.mpr. Формат *.mmx рекомендовано, оскільки він повністю підтримується й не сповільнює завантаження RA2, проте такі карти не передаються іншим гравцям автоматично!
Please specify the new width and height of the map. Left and top will automatically be set so that the old area of the map is centered. You can change left and top to modify the left-top position (you may use negative numbers for left/top).=Укажіть нову ширину й висоту карти. Лівий і верхній відступи буде обчислено автоматично, щоб розмістити стару область по центру. Їх можна змінити, зокрема задавши від'ємні значення.
Please wait a few seconds while FinalAlert 2 is saving. On very large maps this may even take some minutes, please do not cancel! More information is available in the status bar, most time will be needed for packing.=Зачекайте, поки FinalAlert 2 зберігає карту. Для дуже великих карт це може тривати кілька хвилин. Не переривайте процес! Подробиці наведено в рядку стану, найбільше часу займає пакування даних.
Please wait a few seconds while FinalSun is saving. On very large maps this may even take some minutes, please do not cancel! More information is available in the status bar, most time will be needed for packing.=Зачекайте, поки FinalSun зберігає карту. Для дуже великих карт це може тривати кілька хвилин. Не переривайте процес! Подробиці наведено в рядку стану, найбільше часу займає пакування даних.
