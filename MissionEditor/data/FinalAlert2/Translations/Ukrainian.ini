MV_TubeCounterpartMissing=Тунель %5 (%1, %2) -> (%3, %4) не має зворотного тунелю з (%3, %4) -> (%1, %2).\nЦе спричинятиме непередбачувані помилки та аварійне завершення гри.\nЗворотний тунель може мати інший шлях, але його початкова та кінцева клітинки мають бути поміняні місцями.
MV_TubeStartNotUnique=Тунель %5 (%1, %2) -> (%3, %4) має спільні початкові координати з іншими тунелями, кількість яких: %6.\nЦе спричинятиме непередбачувані помилки та аварійне завершення гри.\nЗ кожної клітинки може починатися лише один тунель.
MV_TubeEndNotUnique=Тунель %5 (%1, %2) -> (%3, %4) має спільні кінцеві координати з іншими тунелями, кількість яких: %6.\nЦе спричинятиме непередбачувані помилки та аварійне завершення гри.\nУ кожній клітинці може закінчуватися лише один тунель.
MV_TubeInvalidCounterpartEnd=Для тунелю %5 (%1, %2) -> (%3, %4) знайдено %6 інших тунелів, що закінчуються в його початковій клітинці, але їхні початкові клітинки не збігаються з його кінцевою клітинкою.\nЦе спричинятиме непередбачувані помилки та аварійне завершення гри.\nПочаткові та кінцеві координати зворотного тунелю мають бути поміняні місцями.
MV_TubeInvalidCounterpartStart=Для тунелю %5 (%1, %2) -> (%3, %4) знайдено %6 інших тунелів, що починаються в його кінцевій клітинці, але їхні кінцеві клітинки не збігаються з його початковою клітинкою.\nЦе спричинятиме непередбачувані помилки та аварійне завершення гри.\nПочаткові та кінцеві координати зворотного тунелю мають бути поміняні місцями.
